<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Иконки Telegram iOS</title>
<style>
:root{--bg:#f4f6f8;--card:#fff;--ink:#14212b;--mute:#6a7a88;--line:#dde3e8;--acc:#2a8fd6;--tile:#fff}
@media (prefers-color-scheme:dark){:root{--bg:#10161c;--card:#18212a;--ink:#e8eef3;--mute:#8a9aa8;--line:#26323d;--tile:#18212a}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 -apple-system,"Segoe UI",Roboto,sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:12px 14px;border-bottom:1px solid var(--line)}
h1{font-size:18px;margin:0 0 8px}
.row{display:flex;gap:8px;flex-wrap:wrap}
input,select,button{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px 11px}
input{flex:1 1 180px;min-width:0}
select{flex:1 1 140px;min-width:0}
button{cursor:pointer}
button.p{background:var(--acc);border-color:var(--acc);color:#fff}
#count{color:var(--mute);font-size:13px;margin-top:6px}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px;padding:12px 14px}
.t{background:var(--tile);border:1px solid var(--line);border-radius:10px;padding:8px 6px;text-align:center;cursor:pointer;min-width:0}
.t:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.t img{width:40px;height:40px;object-fit:contain;display:block;margin:0 auto 6px}
.t span{display:block;font-size:11px;color:var(--mute);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dk .t img,.dk #pv img{filter:invert(1)}
.dk .t,.dk #pv{background:#0b0f13}
#m{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:flex-end;justify-content:center;z-index:10}
#m.on{display:flex}
#box{background:var(--card);width:100%;max-width:460px;border-radius:16px 16px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom))}
#pv{background:var(--tile);border:1px solid var(--line);border-radius:12px;height:160px;display:flex;align-items:center;justify-content:center;margin-bottom:10px}
#pv img{width:96px;height:96px;object-fit:contain}
#nm{font-weight:600;word-break:break-all}
#pt{color:var(--mute);font-size:12px;margin:2px 0 12px;word-break:break-all}
</style>
</head>
<body>
<header>
<h1>Иконки Telegram iOS</h1>
<div class="row">
<input id="q" type="search" placeholder="Поиск по названию" aria-label="Поиск">
<select id="cat" aria-label="Категория"></select>
<button id="bg" type="button">Тёмный фон</button>
</div>
<div id="count"></div>
</header>
<main id="grid"></main>
<div id="m" role="dialog" aria-modal="true"><div id="box">
<div id="pv"><img id="im" alt=""></div>
<div id="nm"></div><div id="pt"></div>
<div class="row">
<button id="dl" class="p" type="button">Скачать SVG</button>
<button id="png" type="button">Скачать PNG</button>
<button id="cp" type="button">Копировать SVG</button>
<button id="x" type="button">Закрыть</button>
</div></div></div>
<script>
let all=[],cur=null;
const $=id=>document.getElementById(id);
const url=p=>encodeURI(p);
function render(){
  const q=$('q').value.trim().toLowerCase(),c=$('cat').value;
  const list=all.filter(i=>(!c||i.c===c)&&(!q||(i.n+' '+i.c).toLowerCase().includes(q)));
  $('count').textContent='Найдено: '+list.length+' из '+all.length;
  const g=$('grid');g.textContent='';
  const f=document.createDocumentFragment();
  list.slice(0,600).forEach(i=>{
    const d=document.createElement('div');d.className='t';d.tabIndex=0;d.title=i.c+' / '+i.n;
    const im=document.createElement('img');im.loading='lazy';im.alt=i.n;im.src=url(i.p);
    const s=document.createElement('span');s.textContent=i.n;
    d.append(im,s);
    const open=()=>show(i);
    d.onclick=open;d.onkeydown=e=>{if(e.key==='Enter')open()};
    f.append(d);
  });
  g.append(f);
  if(list.length>600){const n=document.createElement('div');n.style.cssText='grid-column:1/-1;color:var(--mute);text-align:center;padding:10px';n.textContent='Показаны первые 600. Уточни поиск или выбери категорию.';g.append(n)}
}
function show(i){cur=i;$('im').src=url(i.p);$('nm').textContent=i.n;$('pt').textContent=i.c+' · '+i.p;$('m').classList.add('on')}
function save(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),2000)}
const fname=()=>cur.n.replace(/[^\w.-]+/g,'_');
$('dl').onclick=async()=>{const t=await (await fetch(url(cur.p))).text();save(new Blob([t],{type:'image/svg+xml'}),fname()+'.svg')};
$('cp').onclick=async()=>{const t=await (await fetch(url(cur.p))).text();try{await navigator.clipboard.writeText(t);$('cp').textContent='Скопировано'}catch(e){$('cp').textContent='Не удалось'}setTimeout(()=>$('cp').textContent='Копировать SVG',1500)};
$('png').onclick=async()=>{
  const t=await (await fetch(url(cur.p))).text();
  const img=new Image();
  img.onload=()=>{const k=Math.max(1,512/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);c.getContext('2d').drawImage(img,0,0,c.width,c.height);c.toBlob(b=>save(b,fname()+'.png'))};
  img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(t);
};
$('x').onclick=()=>$('m').classList.remove('on');
$('m').onclick=e=>{if(e.target.id==='m')$('m').classList.remove('on')};
document.onkeydown=e=>{if(e.key==='Escape')$('m').classList.remove('on')};
$('bg').onclick=()=>{const d=document.body.classList.toggle('dk');$('bg').textContent=d?'Светлый фон':'Тёмный фон'};
$('q').oninput=render;$('cat').onchange=render;
fetch('icons.json').then(r=>r.json()).then(d=>{
  all=d;
  const cs=[...new Set(d.map(i=>i.c))];
  $('cat').innerHTML='<option value="">Все категории</option>'+cs.map(c=>'<option>'+c.replace(/&/g,'&amp;').replace(/</g,'&lt;')+'</option>').join('');
  render();
}).catch(()=>{$('count').textContent='Не удалось загрузить icons.json'});
</script>
</body>
</html>
